<style>
  /* ── Companies page ─────────────────────────────────────── */
  .nsc-co-page { font-family: 'Lato', sans-serif; max-width: 1100px; margin: 0 auto; padding: 0 16px 60px; }

  /* ── Two-column layout ──────────────────────────────────── */
  .nsc-co-layout { display: flex; gap: 28px; align-items: flex-start; }

  /* ── Filter sidebar ─────────────────────────────────────── */
  .nsc-co-sidebar {
    flex: 0 0 240px; background: #f5f3ee; border-radius: 8px;
    padding: 20px; box-sizing: border-box; position: sticky; top: 20px;
  }
  .nsc-co-sidebar h3 {
    font-family: 'Lato', sans-serif; font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px; color: #3d5a80;
    margin: 0 0 16px;
  }
  .nsc-co-filter-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .nsc-co-filter-group label {
    font-size: 11px; font-weight: 700; color: #555;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .nsc-co-filter-group input[type=text],
  .nsc-co-filter-group select {
    font-family: 'Lato', sans-serif; font-size: 14px;
    padding: 9px 12px; border: 1px solid #c8d8e8; border-radius: 6px;
    background: #fff; color: #1a1a1a; width: 100%; box-sizing: border-box;
  }
  .nsc-co-filter-group input:focus,
  .nsc-co-filter-group select:focus { outline: 2px solid #6699c2; border-color: #6699c2; }
  .nsc-co-btn-clear {
    font-family: 'Lato', sans-serif; font-size: 13px; color: #4477a1;
    background: none; border: 1px solid #c8d8e8; border-radius: 6px;
    padding: 9px 14px; cursor: pointer; width: 100%; margin-top: 4px;
  }
  .nsc-co-btn-clear:hover { background: #d6e6f5; }

  /* ── Main content ───────────────────────────────────────── */
  .nsc-co-main { flex: 1; min-width: 0; }
  .nsc-co-count { font-size: 13px; color: #666; margin: 0 0 16px; }

  .nsc-co-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .nsc-co-card {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    background: #fff; border: 1px solid #dce8f0; border-radius: 10px;
    padding: 24px 20px; text-decoration: none; color: inherit;
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .nsc-co-card:hover { box-shadow: 0 4px 16px rgba(68,119,161,0.15); transform: translateY(-2px); }

  .nsc-co-logo-wrap { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .nsc-co-logo { max-width: 100%; max-height: 100%; object-fit: contain; }
  .nsc-co-logo-placeholder {
    width: 80px; height: 80px; border-radius: 50%;
    background: #d6e6f5; color: #3d5a80;
    font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .nsc-co-name { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; margin: 0 0 6px; color: #1a1a1a; }
  .nsc-co-location { font-size: 13px; color: #555; margin: 0 0 4px; }
  .nsc-co-region { font-size: 12px; color: #6699c2; margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

  .nsc-co-empty { text-align: center; color: #999; padding: 3rem; font-style: italic; display: none; }
  .nsc-co-loading { text-align: center; color: #999; padding: 2rem; }

  @media (max-width: 700px) {
    .nsc-co-layout { flex-direction: column; }
    .nsc-co-sidebar { flex: none; width: 100%; position: static; }
  }
</style>

<div class="nsc-co-page">
  <div class="nsc-co-layout">

    <aside class="nsc-co-sidebar">
      <h3>Filter Companies</h3>

      <div class="nsc-co-filter-group">
        <label for="nsc-co-search">Search</label>
        <input type="text" id="nsc-co-search" placeholder="Search by name…" autocomplete="off">
      </div>

      <div class="nsc-co-filter-group">
        <label for="nsc-co-region">Region</label>
        <select id="nsc-co-region">
          <option value="">All Regions</option>
          <option value="NC">--- North Carolina ---</option>
          <option>Asheville / Western NC</option>
          <option>Charlotte Metro</option>
          <option>Eastern NC</option>
          <option>Outer Banks</option>
          <option>Piedmont</option>
          <option>Triad</option>
          <option>Triangle</option>
          <option>Wilmington / Cape Fear</option>
          <option value="SC">--- South Carolina ---</option>
          <option>Lowcountry</option>
          <option>Midlands</option>
          <option>Pee Dee</option>
          <option>Sandhills</option>
          <option>Upstate</option>
        </select>
      </div>

      <button class="nsc-co-btn-clear" onclick="document.getElementById('nsc-co-search').value=''; document.getElementById('nsc-co-region').value=''; document.getElementById('nsc-co-search').dispatchEvent(new Event('input'));">Clear All Filters</button>
    </aside>

    <div class="nsc-co-main">
      <p class="nsc-co-loading" id="nsc-co-loading">Loading companies…</p>
      <p class="nsc-co-empty" id="nsc-co-empty">No companies match your search.</p>
      <p class="nsc-co-count" id="nsc-companies-count"></p>
      <div class="nsc-co-grid" id="nsc-companies-grid"></div>
    </div>

  </div>
</div>

<script src="https://cdn.neighborhoodstage.com/assets/js/companies.js"></script>
